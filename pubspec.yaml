name: paidix
description: "PaidiX Mobile App - Global invoice, payment and spending platform."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  go_router: ^18.1.2
  image_picker: ^1.2.4
  permission_handler: ^13.0.2
  flutter_local_notifications: ^22.3.3
  url_launcher: ^6.3.3
  path_provider: ^2.1.2
  google_fonts: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image_picker_platform_interface: ^2.11.2

flutter:
  uses-material-design: true
