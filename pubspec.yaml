# Package metadata, supported SDK range, Flutter plugins, and app asset settings.
name: paidix
description: "PaidiX Mobile App - Global invoice, payment and spending platform."
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  # Optional: For hardware-encrypted secure storage of JWT tokens
  # Keep v10 as a migration release before v11; v11 removes legacy cipher
  # support and requires data to be migrated by v10 first.
  flutter_secure_storage: ^10.3.4
  cupertino_icons: ^2.0.0
  go_router: ^18.1.4
  image_picker: ^1.2.4
  permission_handler: ^13.0.2
  flutter_local_notifications: ^23.0.1
  url_launcher: ^6.3.3
  path_provider: ^2.1.5
  google_fonts: ^9.0.0

  material_ui: ^1.11.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image_picker_platform_interface: ^2.11.2

flutter:
  uses-material-design: true
