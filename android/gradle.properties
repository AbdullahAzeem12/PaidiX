# JVM memory and native-access options used by the Gradle daemon.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
android.useAndroidX=true
# Suppress warning for compileSdk 37 with AGP 9.1
android.suppressUnsupportedCompileSdk=37.0
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Fix Windows multi-drive Kotlin incremental compilation (C:\ pub cache vs D:\ project)
kotlin.incremental=false
kotlin.incremental.android=false
kotlin.incremental.jvm=false
