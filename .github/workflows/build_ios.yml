name: Build iOS App (IPA)

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as a GitHub Release with downloadable .ipa?'
        required: false
        type: boolean
        default: true
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - '.github/workflows/build_ios.yml'

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS IPA & App Bundle
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Environment & Flutter Doctor
        run: |
          flutter --version
          flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Test Suite
        run: flutter test

      - name: Build iOS App (Release Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package Payload into Installable .ipa
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r -9 PaidiX.ipa Payload
          cd ../../..
          echo "Generated IPA size:"
          ls -lh build/ios/ipa/PaidiX.ipa

      - name: Compress Runner.app Bundle
        run: |
          cd build/ios/iphoneos
          zip -r -9 Runner.app.zip Runner.app
          cd ../../..

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PaidiX-iOS-IPA
          path: build/ios/ipa/PaidiX.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload Runner.app.zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PaidiX-Runner-App
          path: build/ios/iphoneos/Runner.app.zip
          retention-days: 14

      - name: Create GitHub Release
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.create_release == true) || github.event_name == 'push' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-v1.0.0-build-${{ github.run_number }}
          name: "PaidiX iOS Release v1.0.0 (#${{ github.run_number }})"
          generate_release_notes: true
          body: |
            ### 📱 PaidiX for Apple iOS

            **Download:**
            - **`PaidiX.ipa`**: Direct iOS package for iPhone/iPad users.
            - **`Runner.app.zip`**: Full compiled macOS / Xcode App bundle.

            ---

            ### 📲 How to Install on iPhone / iPad:
            1. **Download `PaidiX.ipa`** from the Assets below.
            2. Choose one of the standard iOS sideloading tools:
               - **Sideloadly** (Windows & Mac - [sideloadly.io](https://sideloadly.io)): Connect iPhone via USB, drag `PaidiX.ipa`, enter your Apple ID, and click Start.
               - **AltStore** ([altstore.io](https://altstore.io)): Send `PaidiX.ipa` to iPhone and tap "Open in AltStore".
               - **Scarlet / TrollStore**: Direct on-device installation.
            3. On your iPhone, go to **Settings > General > VPN & Device Management** and trust your Developer App certificate.
            4. Open **PaidiX** on your iPhone!
          files: |
            build/ios/ipa/PaidiX.ipa
            build/ios/iphoneos/Runner.app.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

